name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # No real Firebase/Twilio/Meta/Gemini credentials are configured in
      # CI on purpose — every integration in this app fails closed rather
      # than crashing when its env vars are unset (see DEPLOYMENT.md), so
      # the production build must succeed without them.
      - name: Build
        run: npm run build
