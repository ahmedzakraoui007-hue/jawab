name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # No real Firebase/Twilio/Meta/Gemini credentials are configured in
      # CI on purpose — every integration in this app fails closed rather
      # than crashing when its env vars are unset (see DEPLOYMENT.md), so
      # the production build must succeed without them.
      - name: Build
        run: npm run build

  verify-server:
    name: server — typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates the @prisma/client types from schema.prisma — needed for
      # typecheck/build to resolve `PrismaClient`. Doesn't need a live
      # DATABASE_URL; it only reads the schema file, never connects.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # vitest.setup.ts sets JWT_ACCESS_SECRET/JWT_REFRESH_SECRET itself —
      # no real secrets or a live Postgres needed for the unit tests.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
